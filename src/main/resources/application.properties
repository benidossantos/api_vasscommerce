# Porta do servidor (o enunciado considera a porta 80, mas em ambiente de
# desenvolvimento local usamos a porta padrao do Spring Boot para nao exigir
# privilegios de administrador. Altere para 80 em producao, se necessario.)
server.port=8080

spring.application.name=vasscommerce-api

# Banco de dados em memoria H2, recriado a cada execucao e populado pelo DataSeeder
spring.datasource.url=jdbc:h2:mem:vasscommerce;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Console H2 disponivel em http://localhost:8080/h2-console (util para depuracao)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Serializacao de datas em formato ISO-8601 (nao como timestamp numerico)
spring.jackson.serialization.write-dates-as-timestamps=false
